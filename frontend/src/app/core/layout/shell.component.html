<header class="shell__header">
  <span class="shell__brand">Agendar</span>
  <nav class="shell__nav" aria-label="Navegação principal">
    @for (item of navItems; track item.path) {
      <a
        class="shell__link"
        [routerLink]="item.path"
        routerLinkActive="shell__link--active"
        [routerLinkActiveOptions]="{ exact: item.path === '/' }"
      >
        {{ item.label }}
      </a>
    }
  </nav>

  <div class="shell__session">
    @if (role(); as currentRole) {
      <span class="shell__role">{{ currentRole }}</span>
    }
    <button type="button" class="shell__logout" (click)="logout()">Sair</button>
  </div>
</header>

<main class="shell__content">
  <router-outlet />
</main>
