spring:
  application:
    name: agendar

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agendar}
    username: ${DB_USER:agendar}
    password: ${DB_PASSWORD:agendar}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    # Um diretório por módulo. As migrations de cada módulo usam o schema do próprio módulo.
    locations: classpath:db/migration
    schemas: platform

management:
  endpoint:
    health:
      show-details: always
  health:
    db:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
