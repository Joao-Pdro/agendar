spring:
  application:
    name: agendar

  # Perfil dev por padrão (tem o segredo do JWT de desenvolvimento). Em produção, SPRING_PROFILES_ACTIVE=prod.
  profiles:
    default: dev

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agendar}
    username: ${DB_USER:agendar}
    password: ${DB_PASSWORD:agendar}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  # Cada módulo de domínio registra o seu Flyway (schema, histórico e locations próprios),
  # porque todos numeram as migrations a partir de V1__. O Flyway global fica desligado
  # para não varrer as migrations de todos os módulos com um histórico único.
  flyway:
    enabled: false

management:
  endpoint:
    health:
      show-details: always
  health:
    db:
      enabled: true

server:
  port: ${SERVER_PORT:8080}

agendar:
  security:
    jwt:
      ttl: ${JWT_TTL:PT8H}
    login:
      # Tentativas falhas do mesmo e-mail dentro da janela antes de bloquear.
      max-tentativas: ${LOGIN_MAX_TENTATIVAS:5}
      janela: ${LOGIN_JANELA:PT15M}
