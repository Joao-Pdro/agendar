services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: agendar
      POSTGRES_USER: agendar
      POSTGRES_PASSWORD: agendar
    ports:
      - "5432:5432"
    volumes:
      - agendar-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agendar -d agendar"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agendar-db-data:
