name: frontend

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

# Em PR, um push novo cancela a execução anterior. Na `main`, nunca: cada commit é um estado
# que chegou a produção e precisa da sua própria validação.
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: npm run verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      # `npm run verify` = lint + boundaries + http-usage + testes (Karma) + build.
      # O Karma precisa de um Chrome; o caminho não é fixado aqui de propósito, porque o
      # runner muda de imagem e um caminho errado quebra o job por um motivo que não é código.
      # O projeto aceita CHROME_BIN quando o Chrome não está no PATH (ver README).
      - name: Lint, testes e build
        run: npm run verify

      - name: Guardar relatório de build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/
          retention-days: 7
          if-no-files-found: ignore
